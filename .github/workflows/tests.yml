name: tests

on:
  # Branches are tested through their pull request; a push trigger for every branch as well
  # would run everything twice, with two "ci" checks of which the first could allow a merge.
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request makes its running tests outdated, so those stop. On main every
# merge is tested to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # The version lives in .python-version alone, which Renovate keeps up to date; the step
      # names below show the version that was installed, so they cannot go out of date.
      - name: Set up Python from .python-version
        id: python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          # A package without wheels for the newest Python yet, such as scikit-image, is built
          # from source, which takes minutes. pip keeps what it built in its cache, and the cache
          # is kept between runs until pyproject.toml changes.
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install on Python ${{ steps.python.outputs.python-version }}
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests on Python ${{ steps.python.outputs.python-version }}
        run: pytest -q

  # One check that only goes green once every system above has passed.
  ci:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every matrix job passed
        run: test "${{ needs.test.result }}" = "success"
