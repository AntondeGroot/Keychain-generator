name: tests

on:
  # Branches are tested through their pull request; a push trigger for every branch as well
  # would run everything twice, with two "ci" checks of which the first could allow a merge.
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request makes its running tests outdated, so those stop. On main every
# merge is tested to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # The version lives in .python-version alone, which Renovate keeps up to date; the step
      # names below show the version that was installed, so they cannot go out of date.
      - name: Set up Python from .python-version
        id: python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          # pip keeps the wheels it downloads in its cache, kept between runs until
          # pyproject.toml changes.
          cache: pip
          cache-dependency-path: pyproject.toml
      # Wheels only: a package without wheels for this Python would be built from source, for
      # minutes on every system. So a Renovate update to a Python that a package has no wheels
      # for yet fails here ("No matching distribution found for ..."): leave it unmerged until
      # the package has them.
      - name: Install on Python ${{ steps.python.outputs.python-version }}
        run: |
          python -m pip install --only-binary=:all: -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      # The page's JavaScript is the same everywhere, so it is checked once, on the Node version
      # in .node-version, which Renovate keeps up to date. It needs no packages.
      - name: Set up Node from .node-version
        if: runner.os == 'Linux'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # A syntax error, such as a name declared twice, stops the whole page from loading. Read as
      # a module from stdin, the check does not depend on Node guessing the file type.
      - name: Check the page's JavaScript
        if: runner.os == 'Linux'
        run: |
          for file in src/keychain/web/static/*.js; do
            node --input-type=module --check < "$file" || { echo "::error file=$file::syntax error in $file"; exit 1; }
          done
      # The tests in tests/js, with floors for the share of lines and functions they run. The
      # floors in package.json sit just below what the tests reach: raise them as tests are
      # added, never lower them. Branches have no floor: V8 counts only those in code that ran.
      - name: Test the page's JavaScript
        if: runner.os == 'Linux'
        run: npm test
      - name: Unit tests on Python ${{ steps.python.outputs.python-version }}
        run: pytest -q

  # One check that only goes green once every system above has passed.
  ci:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every matrix job passed
        run: test "${{ needs.test.result }}" = "success"
