name: tests

on:
  # Branches are tested through their pull request; a push trigger for every branch as well
  # would run everything twice, with two "ci" checks of which the first could allow a merge.
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request makes its running tests outdated, so those stop. On main every
# merge is tested to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest -q

  # One check that only goes green once every OS and Python version above has passed.
  ci:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every matrix job passed
        run: test "${{ needs.test.result }}" = "success"
